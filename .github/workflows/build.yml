name: Build and Test

on:
  push:
    branches: [ '**' ]  # Build on all branches
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:  # Allow manual triggering

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Restore dependencies
      run: dotnet restore WindowsRecoveryApp.sln
      
    - name: Build
      run: dotnet build WindowsRecoveryApp.sln --configuration Release --no-restore
      
    - name: Publish
      run: dotnet publish WindowsRecoveryApp/WindowsRecoveryApp.csproj -c Release -r win-x64 --self-contained -o publish
      
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: WindowsRecoveryApp-${{ github.sha }}
        path: publish/
        retention-days: 30
