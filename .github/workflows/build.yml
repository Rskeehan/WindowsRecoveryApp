name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x
        
    - name: Restore dependencies
      run: dotnet restore WindowsRecoveryApp.sln
      
    - name: Build
      run: dotnet build WindowsRecoveryApp.sln --configuration Release --no-restore
      
    - name: Publish
      run: dotnet publish WindowsRecoveryApp/WindowsRecoveryApp.csproj -c Release -r win-x64 --self-contained -o publish
      
    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: WindowsRecoveryApp
        path: publish/
